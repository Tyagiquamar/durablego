name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Boots throwaway PostgreSQL via testcontainers (Docker is preinstalled
      # on the runner): vet + unit + PostgreSQL suite + process-kill scene.
      - name: Verify
        run: make verify

  go-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # -race needs CGO; ubuntu runners ship gcc.
      #
      # Ryuk is disabled here only: testcontainers-go v0.44.0 has a
      # library-internal data race in its reaper startup (reaperSpawner.
      # reuseOrCreate) that -race flags. Tests terminate containers
      # explicitly via testdb.Start's cleanup, so the reaper safety net
      # is not needed for correctness.
      - name: Race detector
        run: make race
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f Dockerfile .

      - name: Build demo image
        run: docker build -f Dockerfile.demo .

      - name: Validate compose configuration
        run: docker compose config
