name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Boots throwaway PostgreSQL via testcontainers (Docker is preinstalled
      # on the runner): vet + unit + PostgreSQL suite + process-kill scene.
      - name: Verify
        run: make verify

      # -race needs CGO; ubuntu runners ship gcc.
      #
      # Ryuk is disabled here only: testcontainers-go v0.44.0 has a
      # library-internal data race in its reaper startup (reaperSpawner.
      # reuseOrCreate) that -race flags. Tests terminate containers
      # explicitly via testdb.Start's cleanup, so the reaper safety net
      # is not needed for correctness.
      - name: Race detector
        run: make race
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
